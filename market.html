<style>
  :root{
    --bg:#FBF1E0; --card:#FFFBF3; --ink:#4A2F1D; --ink-soft:#8A6F58;
    --accent:#D97D3D; --accent-dark:#B85F26; --accent-soft:#F6DCC0;
    --green:#6E8B3D; --green-soft:#E4EEDA; --border:#E8D9C3; --danger:#B4443C; --danger-soft:#F6DCD8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;overscroll-behavior:none;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  input,textarea{-webkit-user-select:text;user-select:text;}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative;background:var(--bg);
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow:hidden;}
  .header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--border);}
  .header img{width:38px;height:38px;flex:0 0 auto;display:block;}
  .header-text{flex:1;min-width:0;}
  .header-title{font-size:13.5px;font-weight:bold;color:var(--accent-dark);}
  .header-sub{font-size:11px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .subtabs{flex:0 0 auto;display:flex;gap:6px;padding:8px 14px;}
  .pill{flex:1;text-align:center;padding:9px 6px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12.5px;font-family:inherit;color:var(--ink);}
  .pill.active{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;font-weight:bold;}
  .pill:disabled{opacity:0.4;cursor:not-allowed;}
  .pillrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .screen{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 14px 14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0;}
  .card h3{margin:0 0 4px;font-size:15px;}
  .card .sub{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
  .field{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);font-family:inherit;font-size:14px;margin-bottom:10px;background:#fff;color:var(--ink);}
  .btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent-dark);color:#fff;font-size:14.5px;font-weight:bold;font-family:inherit;cursor:pointer;margin-top:8px;}
  .btn.secondary{background:#fff;color:var(--accent-dark);border:1px solid var(--accent-dark);}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .denomgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;}
  .denomgrid .drow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .denomgrid .drow:last-child, .denomgrid .drow:nth-last-child(2){border-bottom:none;}
  .denomgrid .dname{font-size:12.5px;font-weight:bold;}
  .denomgrid .dsub{font-size:10px;color:var(--ink-soft);}
  .denomgrid input{width:56px;padding:6px;border-radius:8px;border:1px solid var(--border);text-align:center;font-family:inherit;font-size:13px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .row:last-child{border-bottom:none;}
  .row .rowlabel{color:var(--ink-soft);}
  .row .rowval{font-weight:bold;}
  .match{padding:9px 12px;border-radius:10px;font-size:12.5px;margin-top:4px;}
  .match.ok{background:var(--green-soft);color:#2D3F16;}
  .match.off{background:var(--danger-soft);color:#6B211C;}
  .catrow{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 14px;
    -webkit-mask-image:linear-gradient(to right, black calc(100% - 28px), transparent 100%);
    mask-image:linear-gradient(to right, black calc(100% - 28px), transparent 100%);}
  .catrow button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12.5px;font-family:inherit;color:var(--ink);white-space:nowrap;}
  .catrow button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold;}
  .combonote{flex:0 0 auto;font-size:10.5px;color:var(--ink-soft);background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:0 14px 8px;}
  .prodlist{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 14px;}
  .prodrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
  .prodrow:last-child{border-bottom:none;}
  .prodname{font-size:13.5px;font-weight:bold;}
  .prodprice{font-size:12px;color:var(--ink-soft);}
  .prodnote{font-size:10px;color:var(--danger);}
  .stepper{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--accent-dark);background:#fff;color:var(--accent-dark);font-size:16px;font-family:inherit;cursor:pointer;}
  .stepper button.add{background:var(--accent-dark);color:#fff;}
  .stepper .qty{width:22px;text-align:center;font-weight:bold;font-size:14px;}
  .cartbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-dark);color:#fff;padding:13px 16px;cursor:pointer;}
  .cartbar .cb-info{font-size:13px;}
  .cartbar .cb-info b{font-size:15px;}
  .cartbar .cb-btn{font-size:13px;font-weight:bold;background:#fff;color:var(--accent-dark);padding:8px 14px;border-radius:999px;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(43,26,15,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 12px;}
  .sheet h3{margin:0;font-size:15.5px;}
  .chip{border-radius:8px;padding:5px 10px;font-size:11.5px;margin-bottom:4px;display:inline-block;margin-right:4px;}
  .chip-expand{cursor:pointer;display:block;}
  .chip-head{display:flex;justify-content:space-between;align-items:center;font-weight:bold;gap:8px;}
  .chip-detail{margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,0.12);}
  .chip-detail-row{display:flex;justify-content:space-between;font-size:10.5px;font-weight:normal;padding:2px 0;gap:8px;}
  .itemlist-scroll{max-height:170px;overflow-y:auto;margin-bottom:4px;}
  .compactrow{font-size:13px;padding:3px 0;}
  .linklike{color:var(--green);font-size:12.5px;font-weight:bold;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;}
  .txnstrip{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:10px;padding:9px 12px;margin:0 14px 8px;font-size:12px;gap:10px;}
  .txnstrip a{color:var(--danger);font-weight:bold;cursor:pointer;text-decoration:underline;white-space:nowrap;}
  .note{font-size:11px;color:var(--ink-soft);margin:6px 0;}
  .chooser-wrap{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px;}
  .chooser-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.12);}
  .chooser-card img{width:64px;height:64px;display:block;margin:0 auto 14px;}
  .chooser-card h1{margin:0 0 6px;font-size:21px;color:var(--ink);}
  .chooser-card .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 22px;}
  .chooser-option{border:2px solid var(--border);border-radius:16px;padding:22px 16px;cursor:pointer;background:#fff;margin-bottom:12px;}
  .chooser-option:last-child{margin-bottom:0;}
  .chooser-option .co-title{font-size:17px;font-weight:bold;color:var(--accent-dark);margin-bottom:4px;}
  .chooser-option .co-sub{font-size:12px;color:var(--ink-soft);}
</style>

// ===== Stage 4: Apps Script backend =====
// Paste your deployed Web App URL here once it exists (see Stage4_AppsScript_Setup.md).
// Until then BACKEND_ENABLED stays false and everything works exactly like the
// Stage 2 mockup: in-memory only, no network calls attempted.
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbz5sZ_ncltTt4lhhocwajymP9CXf7R9u7ZS_wVtIws05QSsbc8JSDQLnVzzARkr9Esw/exec";
const APP_KEY = "baegel-2026-key";
const BACKEND_ENABLED = /^https:\/\//.test(BACKEND_URL);

function todayKey(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
async function apiGet(action, params){
  if(!BACKEND_ENABLED) return {ok:false, error:"backend_not_configured"};
  const qs = new URLSearchParams(Object.assign({action, key:APP_KEY}, params||{})).toString();
  try{
    const res = await fetch(`${BACKEND_URL}?${qs}`);
    return await res.json();
  }catch(err){
    console.warn("apiGet failed", action, err);
    return {ok:false, error:String(err)};
  }
}
async function apiPost(action, payload){
  if(!BACKEND_ENABLED) return {ok:false, error:"backend_not_configured"};
  try{
    const res = await fetch(BACKEND_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, // avoids a CORS preflight Apps Script can't answer
      body: JSON.stringify(Object.assign({action, key:APP_KEY}, payload||{})),
    });
    return await res.json();
  }catch(err){
    console.warn("apiPost failed", action, err);
    return {ok:false, error:String(err)};
  }
}
async function hydrateMarket(){
  const res = await apiGet("getState", {mode:"market", date:todayKey()});
  if(!res || !res.ok) return;
  if(res.today) state.market.day = Object.assign(freshDay(), res.today);
  render();
}

function freshDay(){
  return {items:0, preTax:0, hst:0, revenue:0, cash:0, emt:0, square:0,
    d10:{count:0, amt:0}, d20:{count:0, amt:0}, combo:{count:0, amt:0}, freeItems:0, freeAmt:0, voidCount:0, voidAmt:0};
}
function freshModeState(){
  return {cart:{}, promo:0, payment:"cash", subtab:"sell", day:freshDay(), lastTxn:null, lastVoidReason:null,
    openingDone:false, manualCount:false, marketName:"", denoms:{}, closeDenoms:{}, freeRedemption:null,
    tillStatus:"closed", openedAt:null, closedAt:null, orderConfirmed:false, openingPrompt:null, expandedChip:null,
    orderSeq:0, queue:[]};
}
function elapsedText(ts){
  const mins = Math.floor((Date.now()-ts)/60000);
  if(mins<1) return "just now";
  return mins + " min ago";
}
function fulfillOrder(mode, num){
  const s = state[mode];
  s.queue = s.queue.filter(e=>e.num!==num);
  render();
}
function updateQueueElapsed(){
  document.querySelectorAll('[data-queue-time]').forEach(el=>{
    el.textContent = elapsedText(Number(el.dataset.queueTime));
  });
}

const state = {
  market: Object.assign(freshModeState(), {subtab:"opening"}),
  activeCat:"plain",
};

let deviceChosen = false;
function chooseDevice(mode){
  if(mode==="store"){ window.location.href = "index.html"; return; }
  deviceChosen = true;
  render();
  hydrateMarket();
}
function confirmSwitchDevice(target){
  const s = state.market;
  const hasData = s.openingDone || s.day.items>0 || Object.keys(s.cart).length>0;
  const msg = hasData
    ? "Switch to Store mode? This device isn't saving data yet, so today's Market opening/sales on this phone will be lost when you come back."
    : "Switch to Store mode on this device?";
  if(!window.confirm(msg)) return;
  window.location.href = "index.html";

function fmt(n){ return "$" + (Math.round(n*100)/100).toFixed(2); }
function fmtTime(ts){ return ts ? new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : ""; }
function fmtDate(ts){ return new Date(ts).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric", year:"numeric"}); }

function okTierPrice(okQty){
  if(okQty>=4) return 5.5;
  if(okQty>=2) return 6;
  return null;
}
function computeCart(mode){
  const s = state[mode];
  if(s.freeRedemption && !(s.cart[s.freeRedemption] > 0)) s.freeRedemption = null;
  let subtotal=0, bagelSub=0, otherSub=0, bagelQty=0, totalQty=0;
  let okQty=0, sandwichQty=0;
  Object.keys(s.cart).forEach(key=>{
    const qty = s.cart[key]; if(!qty) return;
    const item = findItem(key);
    if(item.okTier) okQty += qty;
    if(item.comboSandwich) sandwichQty += qty;
  });
  const comboPairs = Math.min(sandwichQty, okQty);
  const comboDiscount = comboPairs*2;
  const remainingOkQty = okQty - comboPairs;
  const okPrice = okTierPrice(remainingOkQty);
  let okComboAllocated = 0;
  let freeCredit = 0, freeItemName = null;
  if(s.freeRedemption){
    const freeItem = findItem(s.freeRedemption);
    if(freeItem && (s.cart[s.freeRedemption]||0) > 0){ freeCredit = freeItem.price; freeItemName = freeItem.name; }
  }
  const itemLines = [];
  Object.keys(s.cart).forEach(key=>{
    const qty = s.cart[key]; if(!qty) return;
    const item = findItem(key);
    let line, comboQty=0, bulkQty=0, bulkUnitPrice=null;
    if(item.okTier){
      if(okComboAllocated < comboPairs){
        comboQty = Math.min(qty, comboPairs - okComboAllocated);
        okComboAllocated += comboQty;
      }
      bulkQty = qty - comboQty;
      bulkUnitPrice = okPrice!==null ? okPrice : item.price;
      line = comboQty*item.price + bulkQty*bulkUnitPrice;
    } else {
      line = item.price*qty;
    }
    subtotal += line; totalQty += qty;
    if(item.promo){ bagelSub += line; bagelQty += qty; }
    else { otherSub += line; }
    itemLines.push({key, name:item.name, qty, price:item.price, line, isPromo:!!item.promo, isOkTier:!!item.okTier, isFree:key===s.freeRedemption, comboQty, bulkQty, bulkUnitPrice});
  });
  const bagelEff = Math.max(0, bagelSub - freeCredit);
  const otherEff = Math.max(0, otherSub - comboDiscount);
  const discountPct = s.promo/100;
  const bagelAfterD = bagelEff*(1-discountPct);
  const otherAfterD = otherEff*(1-discountPct);
  const taxExempt = bagelQty >= 6;
  const taxableBase = taxExempt ? otherAfterD : (bagelAfterD+otherAfterD);
  // Cash pricing (2026-07-29, replaces the earlier 13% cash-discount version): cash orders
  // are tax-INCLUSIVE, not tax-added. The customer pays exactly bagelAfterD+otherAfterD (the
  // plain menu/discount total, no extra add-on) and HST is back-calculated as the portion of
  // that already "inside" it (amt * 13/113), for Ivy's own HST remittance bookkeeping - not
  // charged to the customer on top. EMT/Square are unchanged: HST is added on top as before.
  const hstIncluded = s.payment==="cash";
  const hst = hstIncluded ? taxableBase*(HST/(1+HST)) : taxableBase*HST;
  const total = hstIncluded ? (bagelAfterD+otherAfterD) : (bagelAfterD+otherAfterD+hst);
  const discountAmt = (bagelSub-freeCredit+otherEff) - (bagelAfterD+otherAfterD);
  return {subtotal, bagelSub, otherSub, bagelQty, totalQty, freeCredit, freeItemName, bagelAfterD, otherAfterD, taxExempt, hst, hstIncluded, total, discountAmt, discountPct,
    okQty, okPrice, sandwichQty, comboPairs, comboDiscount, remainingOkQty, itemLines};
}
function findItem(key){
  for(const cat of Object.values(MENU)){ const found = cat.items.find(i=>i.key===key); if(found) return found; }
}

}

function completeSale(mode){
  const s = state[mode];
  const c = computeCart(mode);
  if(c.totalQty===0) return;
  const cartKeys = Object.keys(s.cart).filter(k=>s.cart[k]>0);
  const itemsSummary = cartKeys.map(k=>`${s.cart[k]}x ${findItem(k).name}`).join(", ");
  const sandwichKeys = cartKeys.filter(k=>findItem(k).comboSandwich);
  const saleRecord = {
    mode, marketName: state.market.marketName,
    date: todayKey(), timestamp: new Date().toISOString(),
    items: itemsSummary, paymentMethod: s.payment,
    subtotal: c.subtotal, loyaltyCredit: c.freeCredit, comboDiscount: c.comboDiscount,
    discountPct: s.promo, discountAmount: c.discountAmt, hst: c.hst, total: c.total, taxExempt: c.taxExempt,
  };
  const day = s.day;
  day.items += c.totalQty;
  day.preTax += (c.total - c.hst); // total-minus-hst holds for both tax-added (EMT/Square) and tax-inclusive (cash) math
  day.hst += c.hst;
  day.revenue += c.total;
  day[s.payment] += c.total;
  if(s.promo===10){ day.d10.count++; day.d10.amt += c.discountAmt; }
  if(s.promo===20){ day.d20.count++; day.d20.amt += c.discountAmt; }
  if(c.comboPairs>0){ day.combo.count += c.comboPairs; day.combo.amt += c.comboDiscount; }
  if(c.freeCredit>0){ day.freeItems += 1; day.freeAmt += c.freeCredit; }
  s.orderSeq += 1;
  const orderNum = s.orderSeq;
  if(sandwichKeys.length>0){
    // Full order, not just the sandwich - if a customer's whole order wasn't handed over
    // together, the cashier still needs to see everything they're owed, not just the slow item.
    const fullItems = cartKeys.map(k=>({name:findItem(k).name, qty:s.cart[k], price:findItem(k).price}));
    s.queue.push({num:orderNum, items:fullItems, time:Date.now()});
  }
  s.lastTxn = {total:c.total, payment:s.payment, items:c.totalQty, promo:s.promo, freeCredit:c.freeCredit,
    preTax:(c.total-c.hst), hst:c.hst, isD10:s.promo===10, isD20:s.promo===20, discountAmt:c.discountAmt,
    comboPairs:c.comboPairs, comboDiscount:c.comboDiscount, orderNum};
  s.cart = {}; s.promo = 0; s.freeRedemption = null; s.orderConfirmed = false;
  render();
  apiPost("recordSale", saleRecord);
}
function voidLastSale(mode){
  const s = state[mode]; const t = s.lastTxn; if(!t) return;
  const reasonEl = document.getElementById('voidreason-'+mode);
  const reason = reasonEl ? reasonEl.value.trim() : "";
  const day = s.day;
  day.items -= t.items; day.preTax -= t.preTax; day.hst -= t.hst; day.revenue -= t.total;
  day[t.payment] -= t.total;
  if(t.isD10){ day.d10.count--; day.d10.amt -= t.discountAmt; }
  if(t.isD20){ day.d20.count--; day.d20.amt -= t.discountAmt; }
  if(t.comboPairs>0){ day.combo.count -= t.comboPairs; day.combo.amt -= t.comboDiscount; }
  if(t.freeCredit>0){ day.freeItems -= 1; day.freeAmt -= t.freeCredit; }
  day.voidCount++; day.voidAmt += t.total;
  s.lastVoidReason = reason || "(no reason given)";
  s.lastTxn = null;
  render();
  apiPost("voidSale", {mode, date:todayKey(), reason});
}

      <div class="row"><span class="rowlabel">EMT</span><span class="rowval">${fmt(day.emt)}</span></div>
      <div class="row"><span class="rowlabel">Square</span><span class="rowval">${fmt(day.square)}</span></div>
      <div class="row"><span class="rowlabel">10% discounts given</span><span class="rowval">${day.d10.count} (${fmt(day.d10.amt)})</span></div>
      <div class="row"><span class="rowlabel">20% discounts given</span><span class="rowval">${day.d20.count} (${fmt(day.d20.amt)})</span></div>
      <div class="row"><span class="rowlabel">Combo Pair (Bagel Sandwich + Old Kennedy)</span><span class="rowval">${day.combo.count} (${fmt(day.combo.amt)})</span></div>
      <div class="row"><span class="rowlabel">Loyalty card redemptions (12 stamps)</span><span class="rowval">${day.freeItems} (${fmt(day.freeAmt)})</span></div>
      <div class="row"><span class="rowlabel">Voided sales</span><span class="rowval">${day.voidCount} (${fmt(day.voidAmt)})</span></div>
    </div>
  `;
  const closeRows = DENOMS.map(d=>`<div class="drow"><div><div class="dname">${d.label}</div><div class="dsub">x ${d.val<1?d.val.toFixed(2):"$"+d.val} each</div></div><input type="number" min="0" value="${s.closeDenoms[d.key]||0}" onchange="setCloseDenom('market','${d.key}',this.value)"></div>`).join("");
  const counted = denomTotal(s.closeDenoms);
  const matches = Math.abs(counted-expected) < 0.01;
  const cashSection = `
    <div class="card">
      <h3>Closing till</h3>
      <p class="sub">Count what's in the till at the end of the day.</p>
      <div class="row"><span class="rowlabel">Opening till</span><span class="rowval">${fmt(openingTotal)}</span></div>
      <div class="row"><span class="rowlabel">+ Cash sales today</span><span class="rowval">${fmt(day.cash)}</span></div>
      <div class="row"><span class="rowlabel">= Expected in till</span><span class="rowval">${fmt(expected)}</span></div>
      <div class="denomgrid">${closeRows}</div>
      <div class="row"><span class="rowlabel">Counted total</span><span class="rowval">${fmt(counted)}</span></div>
      <div class="match ${matches?'ok':'off'}">${matches?"Matches expected.":"Does not match expected; recount before closing."}</div>
      <button class="btn" onclick="closeMarketDay()">Confirm and close till: ends the day</button>
    </div>
  `;
  return summary + cashSection;
}

function render(){
  if(!deviceChosen){
    document.getElementById("app").innerHTML = renderDeviceChooser();
    return;
  }
  const s = state.market;
  const subtabsHtml = `<div class="subtabs">
    <button class="pill ${s.subtab==='opening'?'active':''}" onclick="setSubtab('market','opening')">Opening till</button>
    <button class="pill ${s.subtab==='sell'?'active':''}" onclick="setSubtab('market','sell')">Sell</button>
    <button class="pill ${s.subtab==='queue'?'active':''}" onclick="setSubtab('market','queue')">Orders${s.queue.length>0?` (${s.queue.length})`:""}</button>
    <button class="pill ${s.subtab==='closing'?'active':''}" onclick="setSubtab('market','closing')">Closing till</button>
  </div>`;
  let mainHtml;
  if(s.subtab==="opening"){
    mainHtml = `<div class="screen">${renderOpening()}</div>`;
  } else if(s.subtab==="sell"){
    mainHtml = renderSellBody();
  } else if(s.subtab==="queue"){
    mainHtml = `<div class="screen">${renderQueueTab('market')}</div>`;
  } else {
    mainHtml = `<div class="screen">${renderClosing()}</div>`;
  }
  document.getElementById("app").innerHTML = `
    <div class="header">
      ${LOGO_SVG}
      <div class="header-text">
        <div class="header-title">My Bae-Gel &middot; Market</div>
        <div class="header-sub">${s.marketName || "No market selected"} &middot; ${fmtDate(Date.now())}</div>
        <a class="linklike" style="font-size:10.5px;" onclick="confirmSwitchDevice('store')">Switch to Store device</a>
      </div>
    </div>
    ${subtabsHtml}
    ${mainHtml}
    ${renderReviewSheet()}
  `;
}
render();
setInterval(updateQueueElapsed, 15000);
</script>
</body>
</html>
